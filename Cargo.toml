[workspace]
resolver = "2"
members = ["crates/aitelier-geo", "crates/aitelier-anim", "crates/aitelier-graph", "crates/aitelier-render", "crates/aitelier-cli", "crates/aitelier-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
rhai = { version = "1", features = ["sync"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
aitelier-geo = { path = "crates/aitelier-geo" }
aitelier-anim = { path = "crates/aitelier-anim" }
aitelier-graph = { path = "crates/aitelier-graph" }
aitelier-render = { path = "crates/aitelier-render" }
